      from_pin:
        - "[get_pins fpga_core_inst/tile_1__2_/cbx_1__1_/chan*_in*]"
        - "[get_pins fpga_core_inst/tile_1__2_/cbx_1__1_/*pin_O*]"
      to_pin:
        - "[get_pins fpga_core_inst/tile_1__2_/grid_clb_1__1_/*pin_I*]"
      max_delay: 0
      min_delay: 100
      delay_type: comb_max
      clock_group: CLK0
      nworst: 1
      max_paths: 1000
    sdc:
      - /home/yhjiang/work_space/20260429_issue161/aaee/etc/device/ALKDL/qor_signoff/timing_cb/sdc/disable_timing.tcl
