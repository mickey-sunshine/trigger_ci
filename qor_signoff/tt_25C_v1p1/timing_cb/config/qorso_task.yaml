device:
  name: alkaid
  version: s40ulp
technology:
  root: ${PDK_ROOT}
  corner:
    pvt: tt_v1p1
    rc: cn_25c
    ocv: tt
netlist:
  root: ./netlist
  exclude:
    - fabric_netlists.v
    - scc40ulp_uhdc40_hvt.v
    - scc40ulp_uhdc40_lvt.v
    - scc40ulp_uhdc40_rvt.v
  type: gl
  on_chip_variation: false
rc_parasitics:
  root: ./spef
  include: false
report_timing:
  - name: cb_timing_cbx_mux
    current_design:
      - fpga_top
    report_file: /home/yhjiang/work_space/20260429_issue161/aaee/test/tasks/alkaidL/s40/step_run/_work/alkaid_exto/alkaid_ex_netlist/iter0/reports/ultimate/timing/gl/tt_25C_v1p1/[current_design]/cbx_mux.rpt
